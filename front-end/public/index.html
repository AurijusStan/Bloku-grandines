<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lottery DApp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Lottery DApp</h1>
  <p id="walletAddress">Status: Not connected</p>

  <button id="connectMetaMask">Connect MetaMask</button>

  <div>
    <label>Ticket Price (ETH): <span id="ticketPrice">N/A</span></label>
  </div>

  <div>
    <button id="enterLottery">Enter Lottery</button>
  </div>

  <div>
    <button id="viewBalance">View Contract Balance</button>
    <button id="viewParticipants">View Participants</button>
  </div>

  <div>
    <button id="pickWinner" style="background-color: #dc3545;">Pick Winner</button>
  </div>

  <div class="output" id="output">Output will appear here...</div>

  <script type="module" src="app.js"></script>
</body>
</html>
