<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Lottery</h1>
    </header>

    <main>
        <div id="walletSection">
            <button id="connectMetaMask">Connect Wallet</button>
            <p id="walletAddress">Not connected</p>
        </div>

        <div id="lotteryInfo">
            <p class="highlight">Ticket Price: <span id="ticketPrice">Loading...</span> ETH</p>
            <button id="enterLottery">Enter Lottery</button>
        </div>

        <div id="ownerActions" style="display: none;">
            <h2>Owner Actions</h2>
            <button id="viewBalance">View Contract Balance</button>
            <button id="viewParticipants">View Participants</button>
            <button id="pickWinner">Pick Winner</button>
            <div>
                <input type="text" id="newTicketPrice" placeholder="New Ticket Price (ETH)">
                <button id="startNewLottery">Start New Lottery</button>
            </div>
        </div>

        <div id="output" class="output"></div>
    </main>

    <script src="bundle.js"></script>

    <footer>
        <p>Powered by Ethereum</p>
    </footer>
</body>
</html>
